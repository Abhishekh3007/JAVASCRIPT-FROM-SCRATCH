<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Programs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6f8ff, #eef7f1);
            margin: 0;
            padding: 24px;
            color: #1f2937;
        }
        .card {
            max-width: 900px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        h1, h2 {
            margin-top: 0;
        }
        .row {
            display: flex;        
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin: 12px 0;
        }
        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-weight: 600;
        }
        button.secondary {
            background: #111827;
        }
        input {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            min-width: 260px;
        }
        ul {
            padding-left: 20px;
        }
        .highlight {
            background: #fef3c7;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .dark {
            background: #111827;
            color: #f9fafb;
        }
        .dark .card {
            background: #1f2937;
            color: #f9fafb;
        }
        .dark input {
            background: #111827;
            color: #f9fafb;
            border-color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>DOM Programs</h1>
        <p id="intro">This page teaches selection, events, update, create, and remove.</p>

        <h2>1. Select and Change Text</h2>
        <div class="row">
            <button id="changeTextBtn">Change Intro Text</button>
            <button id="highlightBtn" class="secondary">Toggle Highlight</button>
        </div>

        <h2>2. Form and Input</h2>
        <div class="row">
            <input id="nameInput" type="text" placeholder="Enter your name">
            <button id="greetBtn">Show Greeting</button>
        </div>
        <p id="greeting"></p>

        <h2>3. Create and Remove Elements</h2>
        <div class="row">
            <input id="itemInput" type="text" placeholder="Add list item">
            <button id="addBtn">Add Item</button>
            <button id="clearBtn" class="secondary">Clear List</button>
        </div>
        <ul id="todoList"></ul>

        <h2>4. Style and ClassList</h2>
        <div class="row">
            <button id="themeBtn">Toggle Theme</button>
        </div>
    </div>

    <script>
        const intro = document.getElementById('intro');
        const changeTextBtn = document.getElementById('changeTextBtn');
        const highlightBtn = document.getElementById('highlightBtn');
        const nameInput = document.getElementById('nameInput');
        const greetBtn = document.getElementById('greetBtn');
        const greeting = document.getElementById('greeting');
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const clearBtn = document.getElementById('clearBtn');
        const todoList = document.getElementById('todoList');
        const themeBtn = document.getElementById('themeBtn');

        changeTextBtn.addEventListener('click', function () {
            intro.textContent = 'The text changed because JavaScript selected this element and updated textContent.';
        });

        highlightBtn.addEventListener('click', function () {
            intro.classList.toggle('highlight');
        });

        greetBtn.addEventListener('click', function () {
            const name = nameInput.value.trim();
            greeting.textContent = name ? 'Hello, ' + name + '!' : 'Please enter your name first.';
        });

        function addListItem() {
            const value = itemInput.value.trim();
            if (!value) {
                return;
            }

            const li = document.createElement('li');
            li.textContent = value;

            li.addEventListener('click', function () {
                li.remove();
            });

            todoList.appendChild(li);
            itemInput.value = '';
            itemInput.focus();
        }

        addBtn.addEventListener('click', addListItem);

        itemInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                addListItem();
            }
        });

        clearBtn.addEventListener('click', function () {
            todoList.innerHTML = '';
        });

        themeBtn.addEventListener('click', function () {
            document.body.classList.toggle('dark');
        });
    </script>
</body>
</html>
